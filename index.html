<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Church — Tanks and Temples · Gaussian Splat</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1d21; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; color: #aaa;
    font-size: 13px; text-align: center; pointer-events: none; user-select: none;
    background: linear-gradient(to top, rgba(26,29,33,.9), rgba(26,29,33,0));
  }
  #hud b { color: #eee; font-size: 14px; }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; color: #999; font-size: 15px;
    background: #1a1d21; z-index: 10; transition: opacity .4s;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="loading">불러오는 중…</div>
<div id="hud"><b>Church</b> (Tanks and Temples) · 드래그로 회전 · 스크롤/핀치로 확대·축소</div>

<script type="module">
import * as GaussianSplats3D from 'https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js';

// Framing verified by GPU renders (PC Chrome) of the final splat:
// - Church is an INTERIOR scene; COLMAP Y-down orientation is preserved in the splat,
//   so world up is -Y.
// - Camera reproduces COLMAP photo 000050's viewpoint facing the altar:
//   pos (0.63, 0.59, 1.18), look toward (-1.12, 1.39, 5.78).
const viewer = new GaussianSplats3D.Viewer({
  rootElement: document.getElementById('app'),
  cameraUp: [0, -1, 0],
  initialCameraPosition: [0.63, 0.59, 1.18],
  initialCameraLookAt: [-1.12, 1.39, 5.78],
  sharedMemoryForWorkers: false,
  gpuAcceleratedSort: false,
  antialiased: true,
  logLevel: GaussianSplats3D.LogLevel.None
});
window.__viewer = viewer;

// The full splat file (69.3 MB) exceeds the GitHub API single-blob limit,
// so it is stored split into 3 parts and reassembled here before loading.
async function loadSplat() {
  const partNames = ['./splat.part1', './splat.part2', './splat.part3'];
  const bufs = [];
  let total = 0;
  for (const name of partNames) {
    const resp = await fetch(name);
    if (!resp.ok) throw new Error(name + ' ' + resp.status);
    const buf = await resp.arrayBuffer();
    bufs.push(buf); total += buf.byteLength;
    const el = document.getElementById('loading');
    if (el) el.textContent = '불러오는 중… ' + Math.round(bufs.length / partNames.length * 100) + '%';
  }
  const merged = new Uint8Array(total);
  let off = 0;
  for (const b of bufs) { merged.set(new Uint8Array(b), off); off += b.byteLength; }
  const blobUrl = URL.createObjectURL(new Blob([merged], { type: 'application/octet-stream' }));
  return viewer.addSplatScene(blobUrl, {
    format: GaussianSplats3D.SceneFormat.Splat,
    splatAlphaRemovalThreshold: 5,
    showLoadingUI: false
  });
}

loadSplat().then(() => {
  const fitFov = () => {
    if (!viewer.camera) return;
    const aspect = window.innerWidth / window.innerHeight;
    const baseHalf = Math.tan(THREE_DEG2RAD * 25);
    let vfov = 50;
    if (aspect < 1) vfov = Math.min(85, 2 * Math.atan(baseHalf / aspect) / THREE_DEG2RAD);
    viewer.camera.fov = vfov;
    viewer.camera.updateProjectionMatrix();
  };
  const THREE_DEG2RAD = Math.PI / 180;
  fitFov();
  window.addEventListener('resize', fitFov);
  viewer.start();
  let frames = 0;
  const tick = () => {
    frames++;
    if (frames > 20) {
      window.__splatReady = true;
      const el = document.getElementById('loading');
      if (el) { el.style.opacity = '0'; setTimeout(() => el.remove(), 500); }
    } else {
      requestAnimationFrame(tick);
    }
  };
  requestAnimationFrame(tick);
}).catch((err) => {
  const el = document.getElementById('loading');
  if (el) el.textContent = '로딩 실패: ' + err.message;
  window.__splatError = String(err && err.message || err);
});
</script>
</body>
</html>
